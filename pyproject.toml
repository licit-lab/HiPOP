[project]
name = "HiPOP"
version = "1.0.0"
description = "High Performance Optimal Path module"
requires-python = ">= 3.10"
license = "LGPL-3.0-only"
license-files = ["LICENSE"]
# TODO authors/maintainers
# TODO keywords
# TODO classifiers

[project.urls]
Repository = "https://github.com/EMob-Lab/HiPOP"
Issues = "https://github.com/EMob-Lab/HiPOP/issues"

[dependency-groups]
build = [ # Must be maintained identical to "build-system".requires
    "scikit-build-core >= 1.0",
    "pybind11", # TODO pybind11 version requirements?
]
test = [ # Must be maintained identical to tool.cibuildwheel."test-requires"
    "pytest >= 9.0",
]
dev = [
    { include-group = "build" },
    { include-group = "test" },
]

[build-system]
requires = [ # Must be maintained identical to "dependency-groups".build
    "scikit-build-core >= 1.0",
    "pybind11", # TODO pybind11 version requirements?
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["python/hipop"] # Location of the pure Python package to include in the wheel...
wheel.exclude = ["**/*.cpp"]      # ... but the C++ sources of the wrapper must be excluded.
build-dir = "build-scikit"
editable.verbose = true
editable.rebuild = true

[tool.scikit-build.cmake.define]
HIPOP_WITH_PYTHON = "ON"
HIPOP_WITH_TESTS = "OFF"
HIPOP_WITH_EXAMPLES = "OFF"

[tool.cibuildwheel]
build = [ # Build Linux + Win for x64, and MacOS for ARM64. TODO is it enough?
    "*-manylinux_x86_64",
    "*-win_amd64",
    "*-macosx_arm64",
]
skip = [ # Exclude non-standard Python interpreters and free-threaded versions of the standard interpreter.
    "cp3??t-*", # Free-threaded standard interpreter (https://docs.python.org/3/glossary.html#term-free-threading).
    "pp*",      # PyPy interpreter (https://pypy.org/).
    "gp*",      # GraalPy interpreter (https://graalpy.org/).
]
test-requires = [ # Must be maintained identical to "dependency-groups".test
    "pytest >= 9.0",
]
test-command = "pytest {project}"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
# AppleClang has no bundled OpenMP: install libomp and point CMake at it via OpenMP_ROOT.
# `delocate` then vendors libomp.dylib into the wheel.
before-all = "brew install libomp"
environment = { OpenMP_ROOT = "$(brew --prefix libomp)", MACOSX_DEPLOYMENT_TARGET = "10.15" }

[tool.cibuildwheel.windows]
# Force-bundle the MSVC OpenMP runtime (vcomp140.dll) so the wheel is self-contained.
repair-wheel-command = "delvewheel repair --add-dll vcomp140.dll -w {dest_dir} {wheel}"
