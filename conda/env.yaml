# Development environment for HiPOP.
#
# Usage:
#   conda create -f conda/env.yaml    # Only once, to create the environment.
#   conda activate hipop-dev          # Each time you want to work on HiPOP.
#
# Using this environment (and more generally, using conda) is optional:
# if the dependencies listed here are already available on your system,
# you can use them directly without creating a conda environment.
#
name: hipop-dev
channels:
  - conda-forge
  - nodefaults # Disable the default Anaconda channel.
dependencies:
  - cmake
  - cxx-compiler
  - llvm-openmp # Other OpenMP implementations are OK for HiPOP, LLVM/OpenMP is not mandatory.
  - pip
  - python=3.10
